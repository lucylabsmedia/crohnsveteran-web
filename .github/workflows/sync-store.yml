name: Sync Printful Store Products

on:
  push:
    branches: [ main ]
  schedule:
    # Runs daily at midnight UTC to keep product sync up to date
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger anytime from the GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-store:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch products from Printful
        env:
          PRINTFUL_API_KEY: ${{ secrets.PRINTFUL_API_KEY }}
        run: node fetch-printful.js

      - name: Commit and push updated products.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add products.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync Printful products [skip ci]" && git push)